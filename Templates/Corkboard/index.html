<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harsha - Links</title>
    <meta name="description" content="A hand-drawn, sketchbook-style link page built with the Corkboard LinkFree template.">

    <!-- Fonts: Kalam for headings, Patrick Hand for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Inline icon sprite. Kept in the document so the page needs no
         icon font and works offline / over file://. -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false" width="0" height="0">
        <symbol id="icon-github" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.4 6.4-1.5 6.4-7A5.4 5.4 0 0 0 20 4.8 5.1 5.1 0 0 0 19.9 1S18.7.6 16 2.5a13.4 13.4 0 0 0-7 0C6.3.6 5.1 1 5.1 1A5.1 5.1 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.3 6.6 6.4 7A3.4 3.4 0 0 0 9 18.1V22"/>
            </g>
        </symbol>
        <symbol id="icon-twitter" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 3a10.9 10.9 0 0 1-3.1 1.5 4.5 4.5 0 0 0-7.9 3v1A10.7 10.7 0 0 1 3 4s-4 9 5 13a11.6 11.6 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.1-.8A7.7 7.7 0 0 0 23 3z"/>
            </g>
        </symbol>
        <symbol id="icon-instagram" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.6" y="2.8" width="18.8" height="18.6" rx="5.4" ry="5.1"/>
                <path d="M16.1 11.4A4.1 4.1 0 1 1 12.6 8a4.1 4.1 0 0 1 3.5 3.4z"/>
                <path d="M17.5 6.5h.01"/>
            </g>
        </symbol>
        <symbol id="icon-linkedin" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/>
                <path d="M2.2 9.2h3.9v11.6H2.2z"/>
                <path d="M4.2 3.2a2.1 2.1 0 1 0 .1 4.2 2.1 2.1 0 0 0-.1-4.2z"/>
            </g>
        </symbol>
        <symbol id="icon-youtube" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22.5 6.4a2.8 2.8 0 0 0-1.9-2C18.9 4 12 4 12 4s-6.9 0-8.6.5a2.8 2.8 0 0 0-1.9 2A29 29 0 0 0 1 11.8a29 29 0 0 0 .5 5.3 2.8 2.8 0 0 0 1.9 2c1.7.5 8.6.5 8.6.5s6.9 0 8.6-.5a2.8 2.8 0 0 0 1.9-2 29 29 0 0 0 .5-5.3 29 29 0 0 0-.5-5.4z"/>
                <path d="M9.8 15 15.5 11.8 9.8 8.5z"/>
            </g>
        </symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <path d="M22 6 12 13 2 6"/>
            </g>
        </symbol>
        <symbol id="icon-link" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7.1l-1.7 1.7"/>
                <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7.1l1.7-1.7"/>
            </g>
        </symbol>
    </svg>

    <div class="paper">
        <header class="profile">
            <!-- Decorative doodle. Purely ornament - hidden on small screens. -->
            <svg class="doodle doodle--star" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
                <path d="M30 6 34 24 52 27 37 36 41 54 30 43 19 54 23 36 8 27 26 24z"
                      fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <div class="avatar-frame wobbly-circle">
                <img id="userPhoto" src="" alt="">
            </div>

            <h1 id="userName" class="wobbly-md"></h1>

            <!-- Hand-drawn underline tying the identity together. -->
            <svg class="squiggle" viewBox="0 0 220 14" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path d="M3 8C24 2 42 12 63 7S102 2 122 8s38 5 60-1 33-3 35 1"
                      fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>

            <p id="userHandle" class="handle"></p>
            <p id="userBio" class="bio"></p>
        </header>

        <main>
            <div id="links" class="link-list" aria-label="Links"></div>

            <!-- Filled by script.js. Stays hidden when the config has no
                 testimonials, so it never leaves an empty heading behind. -->
            <section id="testimonials" class="testimonials" hidden aria-label="Testimonials"></section>
        </main>

        <footer class="site-footer">
            <p id="footerText"></p>

            <!-- Permanent author credit. Deliberately hardcoded here instead of
                 living in config.js, so it survives anyone customising the
                 template rather than being overwritten with the demo content. -->
            <p class="credit">
                Template by <a href="https://github.com/Harxshz7" target="_blank" rel="noopener noreferrer">@Harxshz7</a>
            </p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
