<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Profile – 3D Bubbles · Pure Glass</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ===== 3D BUBBLES BACKGROUND ===== -->
<div class="bubbles-container" aria-hidden="true">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
    <div class="bubble bubble-6"></div>
    <div class="bubble bubble-7"></div>
</div>

<!-- ===== PROFILE CARD ===== -->
<div class="card">

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Profile Picture -->
    <img
            class="avatar"
            src="https://ui-avatars.com/api/?name=Sohrab+Sarabi&size=150&background=2a2a2e&color=f5f5f7&bold=true&font-size=0.5"
            alt="Profile picture of Sohrab Sarabi"
    />

    <!-- Name -->
    <h1 class="name">Sohrab Sarabi</h1>

    <!-- Profession -->
    <span class="profession">✦ Creative Developer</span>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Bio -->
    <p class="bio">
        Building digital experiences with a touch of magic.<br/>
        ✦ Design · Code · Community ✦
    </p>

    <!-- Social Media Links -->
    <ul class="social-list">
        <li>
            <a href="https://x.com/sarabisohrab" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
        </li>
        <li>
            <a href="https://github.com/sarabisohrab" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </li>
        <li>
            <a href="http://linkedin.com/in/sarabisohrab" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
        </li>
        <li>
            <a href="https://t.me/sarabisohrab" aria-label="Telegram">
                <i class="fab fa-telegram"></i>
            </a>
        </li>
        <li>
            <a href="https://instagram.com/sarabisohrab" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </li>
    </ul>

    <div class="footnote"><a href="https://sarabisohrab.ir">⚡ let's connect</a></div>

</div>

<!-- ===== Toggle Script ===== -->
<script src="script.js"></script>

</body>
</html>
